<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vui học Toán cùng cô Ngọc - trò chơi toán tương tác cho trẻ mầm non"
    />
    <title>Vui học Toán cùng cô Ngọc</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>
    <div class="background-orb orb-three"></div>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">123</div>
          <div>
            <p class="eyebrow">Khối lớp mầm non</p>
            <h1>Vui học Toán</h1>
          </div>
        </div>

        <div class="header-actions">
          <div class="score-panel" aria-live="polite">
            <span>Điểm</span>
            <strong id="scoreValue">0</strong>
          </div>
          <button type="button" class="ghost-btn" id="voiceBtn" aria-label="Giới thiệu trò chơi">
            🔊
          </button>
        </div>
      </header>

      <nav class="game-nav" id="gameNav" aria-label="Chọn trò chơi"></nav>

      <main class="game-panel">
        <div class="game-header">
          <div>
            <p class="game-tag">Trò chơi</p>
            <h2 id="gameTitle">Đếm đồ vật và phép toán</h2>
          </div>

          <div class="difficulty-switch" aria-label="Chọn độ khó">
            <button type="button" class="mode-btn active" data-mode="easy">Dễ</button>
            <button type="button" class="mode-btn" data-mode="hard">Nâng cao</button>
          </div>
        </div>

        <div class="game-content" id="gameContent"></div>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
