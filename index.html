<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Be Vui Hoc Toan 123 - Trò chơi giáo dục toán cho trẻ mầm non bằng HTML, CSS và JavaScript."
    />
    <title>Be Vui Hoc Toan 123</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>
    <div class="background-orb orb-three"></div>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">123</div>
          <div>
            <p class="eyebrow">Trò chơi cho bé</p>
            <h1>Be Vui Hoc Toan 123</h1>
          </div>
        </div>

        <div class="header-actions">
          <div class="score-panel">
            <span>Điểm</span>
            <strong id="scoreValue">0</strong>
          </div>
          <button id="voiceBtn" class="ghost-btn" type="button" aria-label="Đọc hướng dẫn">
            🔊 Giọng đọc
          </button>
        </div>
      </header>

      <nav id="gameNav" class="game-nav" aria-label="Chọn trò chơi"></nav>

      <main class="game-panel">
        <div class="game-header">
          <div>
            <p id="gameTag" class="game-tag">Trò chơi</p>
            <h2 id="gameTitle">Đếm số</h2>
          </div>

          <div class="difficulty-switch" aria-label="Chọn cấp độ">
            <button class="mode-btn active" data-mode="easy" type="button">Dễ</button>
            <button class="mode-btn" data-mode="hard" type="button">Nâng cao</button>
          </div>
        </div>

        <div id="gameContent" class="game-content"></div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
